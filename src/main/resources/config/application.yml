application:
  version: api/v1
  path:
    base:
      private: /private/${application.version}
      public: /public/${application.version}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  data:
    redis:
      url: ${UPSTASH_REDIS_REST_URL}
      password: ${UPSTASH_REDIS_REST_TOKEN}

  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
            protocols: TLSv1.2

app:
  activation:
    base-url: ${APP_BASE_URL}
    token-expiry-hours: ${ACTIVATION_TOKEN_EXPIRY:24}

s3:
  endpoint: ${S3_ENDPOINT}
  region: ${S3_REGION}
  access-key-id: ${S3_KEY_ID}
  secret-access-key: ${S3_ACCESS_KEY}
  bucket-name: ${S3_BUCKET_NAME}

server:
  port: 8082
  servlet:
    context-path: ${SERVER_CTX_PATH}

proxy:
  enable: false
  host: localhost
  port: 8082

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  payment-url: ${VNPAY_PAYMENT_URL}
  return-url: ${VNPAY_RETURN_URL}
  frontend-return-url: http://localhost:4200/orders

logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
